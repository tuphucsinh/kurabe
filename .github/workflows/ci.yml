name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kurabe_harness
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kurabe_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and regression tests
        run: npm test

      - name: Verify disposable loopback DB and real browser
        run: >-
          node scripts/verify-release.mjs --suite harness
          --db-host 127.0.0.1 --db-port 5432
          --db-name kurabe_harness --db-user postgres

      - name: Scan source for secrets
        run: node scripts/scan-source-secrets.mjs

      - name: Run build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: synthetic-service-role-key-placeholder
