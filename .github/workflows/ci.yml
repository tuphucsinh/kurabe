name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    # P110M5T01: pin image đã được xác minh xanh (ubuntu-latest đang trong
    # quá trình migrate sang Ubuntu 26 theo thông báo của GitHub).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: npm ci

      - name: Validate checked-in CI suite manifest
        run: node scripts/verify-release.mjs --suite ci-suite-manifest

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit and regression tests
        run: npm test

      - name: Bind disposable confirmation evidence to checked-out candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          changed_hashes="$(node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { P103M4T02_CHANGED_FILES } from './tests/operations/ci-suite-manifest.mjs';
          const hashes = Object.fromEntries(P103M4T02_CHANGED_FILES.map((file) => [
            file,
            crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex'),
          ]));
          process.stdout.write(JSON.stringify(hashes));
          NODE
          )"
          {
            printf 'KURABE_CONFIRMATION_CANDIDATE_SHA=%s\n' "$candidate_sha"
            printf 'KURABE_CONFIRMATION_CHANGED_FILES_SHA256=%s\n' "$changed_hashes"
            printf 'KURABE_CONFIRMATION_INTEGRATION_EVIDENCE=%s\n' "$RUNNER_TEMP/kurabe-confirmation-matrix.json"
            printf 'KURABE_H5_ARTIFACT_ROOT=%s\n' "$RUNNER_TEMP/kurabe-h5-auth"
          } >> "$GITHUB_ENV"

      - name: Provision real disposable confirmation runtime
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node .github/ci/confirmation-runtime.mjs start
          node .github/ci/confirmation-runtime.mjs bootstrap
          node .github/ci/confirmation-runtime.mjs export-env

      - name: Run authenticated confirmation matrix
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --suite confirmation-matrix --tier authenticated \
            --evidence "$RUNNER_TEMP/kurabe-confirmation-matrix.json"

      - name: Report worktree status before the qualification lane
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKTREE_STATUS_BEFORE_QUALIFICATION:"
          git status --porcelain=v1 --untracked-files=all || true

      - name: Run integrated P107 qualification suite
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --suite p107-qualification --tier authenticated \
            --evidence "$RUNNER_TEMP/p107-qualification.json"

      # P110M2T01: keep the (redacted) qualification evidence + diagnostics when the
      # lane fails, so a stall/failure is diagnosable from the run page instead of a
      # single opaque line on a vanished runner.
      - name: Upload qualification diagnostics on failure
        if: cancelled() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: p107-qualification-diagnostics
          # JSON only: the redacted evidence/diagnostics artifacts. Never the
          # `.runtime` tree (unredacted app copy + node_modules + chrome profile).
          path: ${{ runner.temp }}/p107-qualification*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify disposable loopback DB and real browser
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --suite harness \
            --db-host "$KURABE_DB_HOST" --db-port "$KURABE_DB_PORT" \
            --db-name "$KURABE_DB_NAME" --db-user "$KURABE_DB_USER"

      - name: Scan source for secrets
        run: node scripts/scan-source-secrets.mjs

      - name: Run build
        run: npm run build
        env:
          NODE_ENV: production
          # P105M1T01 R1: NEXT_PUBLIC_* is inlined into the server bundle at build
          # time, so production smoke on `next start` must be built against the real
          # disposable runtime exported by export-env, not the legacy placeholders.
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.KURABE_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.KURABE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.KURABE_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Production smoke
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node scripts/verify-release.mjs --suite production-smoke

      - name: Cleanup disposable confirmation runtime
        if: always()
        shell: bash
        env:
          KURABE_CI_RUNTIME_ROOT: ${{ runner.temp }}/kurabe-confirmation-runtime
        run: |
          set -euo pipefail
          node .github/ci/confirmation-runtime.mjs cleanup
